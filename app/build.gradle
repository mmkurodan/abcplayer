plugins {
    id 'com.android.application'
}

android {
    namespace "com.example.abcplayer"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.abcplayer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.github.wendykierp:JTransforms:3.1'
    implementation 'androidx.core:core:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
